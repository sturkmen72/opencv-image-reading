version: 1.0.{build}
image: Visual Studio 2022

platform:
  - x64

install:
  - cmd: call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
  # Install Nasm
  - cmd: appveyor DownloadFile "https://github.com/joedrago/nasm_mirror/raw/master/nasm-2.15.05-win64.zip" -FileName "nasm.zip"
  - cmd: 7z x "nasm.zip" > nul
  - cmd: move nasm-* NASM
  - cmd: set PATH=%PATH%;%CD%\NASM;
  - cmd: nasm -v
  - cmd: git clone --depth=1 --branch=4.x https://github.com/sturkmen72/opencv.git
  - cmd: git clone --depth=1 --branch=4.x https://github.com/sturkmen72/opencv_extra.git
  - cmd: md build-opencv
  - cmd: cd build-opencv
  - cmd: set _CL_=/fsanitize=address /GS- /wd5072 & set _LINK_=/InferASanLibs /incremental:no /debug
  - cmd: cmake -A Win32 -DBUILD_LIST="videoio,ts" -DCMAKE_SYSTEM_VERSION=10.0.26100.0 -DOPENCV_ENABLE_MEMORY_SANITIZER=ON -DCV_DISABLE_OPTIMIZATION=OFF -DBUILD_PERF_TESTS=ON -DWITH_ZLIB_NG=OFF -DWITH_IMGCODEC_GIF=OFF -DWITH_SPNG=OFF -DWITH_JPEG=OFF -DWITH_TIFF=OFF -DWITH_WEBP=OFF -DWITH_JASPER=OFF -DWITH_OPENJPEG=OFF -DWITH_OPENEXR=OFF -DWITH_IPP=OFF -DWITH_ADE=OFF -DWITH_ITT=OFF -DBUILD_PROTOBUF=OFF -DBUILD_JAVA=OFF ../opencv
  - cmd: cmake --build . --config Release
  - cmd: cd..
  - cmd: set PATH=%PATH%;C:\projects\opencv-image-reading\build-opencv\bin\Release
  - cmd: set OpenCV_DIR=C:\projects\opencv-image-reading\build-opencv
  - cmd: set OPENCV_TEST_DATA_PATH=C:\projects\opencv-image-reading\opencv_extra\testdata
  - cmd: C:\projects\opencv-image-reading\build-opencv\bin\Release\opencv_test_imgcodecs.exe
  - cmd: md build
  - cmd: cd build
  - cmd: cmake ..
  - cmd: cmake --build . --config Release
  - cmd: cd..
  - cmd: C:\projects\opencv-image-reading\build\Release\test-1.exe
  - cmd: C:\projects\opencv-image-reading\build\Release\test-2.exe

build_script:
  - cmd: cd build
  - cmd: cmake ..
  - cmd: cmake --build . --config Release

test_script:
  - cmd: C:\projects\opencv-image-reading\build-opencv\bin\Release\opencv_perf_imgcodecs.exe --perf_force_samples=5

